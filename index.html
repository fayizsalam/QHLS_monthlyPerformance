<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QHLS | August Top 10 Performers</title>
    <link rel="icon" type="png" href="https://github.com/fayizsalam/QHLS_Quiz_Results/blob/main/QHLS_LOGO_CHUNKAM_UNIT.png?raw=true">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        creamBg: '#FAF8F5',
                        goldCard: 'rgba(255, 255, 255, 0.85)',
                        goldBorder: 'rgba(217, 180, 74, 0.3)',
                        luxuryGold: {
                            500: '#D9B44A',
                            600: '#C29B38',
                            700: '#997522',
                            800: '#73571A'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        title: ['Cinzel', 'serif'],
                        winners: ['Cinzel Decorative', 'serif'],
                        arabic: ['Noto Naskh Arabic', 'serif'],
                        malayalam: ['Noto Sans Malayalam', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Noto+Naskh+Arabic&family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #FAF8F5;
            color: #2D2A26;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -2;
            background: 
                radial-gradient(circle at 10% 20%, rgba(217, 180, 74, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(194, 155, 56, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 235, 153, 0.08) 0%, transparent 70%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(217, 180, 74, 0.25);
            box-shadow: 0 20px 45px rgba(115, 87, 26, 0.06), inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .glass-row {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-row:hover {
            background: rgba(217, 180, 74, 0.06);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(217, 180, 74, 0.1);
        }

        @keyframes goldShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .gold-shimmer {
            background: linear-gradient(90deg, #997522 0%, #D9B44A 25%, #73571A 50%, #D9B44A 75%, #997522 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShimmer 5s linear infinite;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #FAF8F5; }
        ::-webkit-scrollbar-thumb { background: rgba(217, 180, 74, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(217, 180, 74, 0.6); }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-slate-900">

    <div class="ambient-glow"></div>
    <canvas id="bgCanvas"></canvas>

    <div>
        <!-- Header Section -->
        <header class="py-8 px-4 text-center relative">
            <div class="max-w-5xl mx-auto flex flex-col items-center">
                <div class="relative mb-2 group">
                    <div class="absolute inset-0 bg-amber-400/25 blur-3xl rounded-full opacity-60 group-hover:opacity-100 transition-opacity"></div>
                    <img src="https://github.com/fayizsalam/QHLS_Quiz_Results/blob/main/QHLS_LOGO_CHUNKAM_UNIT.png?raw=true" 
                         onerror="this.style.display='none'" 
                         alt="QHLS Logo" 
                         class="relative h-[200px] sm:h-[240px] md:h-[280px] w-auto object-contain drop-shadow-[0_15px_25px_rgba(115,87,26,0.12)]">
                </div>
                
                <h1 class="text-xs sm:text-sm uppercase tracking-[0.3em] font-semibold text-slate-500 mb-3 font-title">Weekly Online Quiz Results</h1>
                
                <div class="inline-flex items-center gap-3 px-6 py-2.5 glass-panel rounded-full shadow-lg border border-amber-500/20">
                    <span class="text-amber-800 font-bold font-malayalam text-sm sm:text-base tracking-wide flex items-center gap-2">
                        <span class="text-lg">📖</span> സൂറത്തുല്‍ മുഅ്മിനൂന്‍
                    </span>
                </div>
            </div>
        </header>

        <!-- Main Results View -->
        <main class="max-w-5xl mx-auto px-4 pb-16">
            <div class="text-center mb-8 mt-2">
                <h2 class="font-winners gold-shimmer text-2xl sm:text-4xl md:text-2xl pb-2 tracking-wider uppercase font-extrabold drop-shadow-sm px-2">
                    AUGUST Month Top 10 Performers
                </h2>
                <p class="text-xs tracking-[0.2em] text-amber-800/60 uppercase mt-1">Excellence & Dedication</p>
            </div>

            <!-- Responsive Container -->
            <div class="max-w-4xl mx-auto">
                
                <!-- MOBILE VIEW: Cards Layout (< md breakpoint) -->
                <div id="resultsCardContainer" class="block md:hidden space-y-4">
                    <div class="glass-panel p-8 text-center rounded-[24px]">
                        <div class="flex flex-col items-center justify-center gap-4">
                            <div class="w-10 h-10 border-3 border-amber-600 border-t-transparent rounded-full animate-spin shadow-md"></div>
                            <span class="font-medium text-slate-500 text-sm tracking-wide">Loading elite results...</span>
                        </div>
                    </div>
                </div>

                <!-- DESKTOP VIEW: Table Layout (>= md breakpoint) -->
                <div class="hidden md:block glass-panel rounded-[32px] overflow-hidden shadow-[0_20px_50px_rgba(115,87,26,0.08)] border border-amber-500/20">
                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left border-collapse min-w-[650px]">
                            <thead>
                                <tr class="border-b border-amber-500/20 bg-amber-100/40 text-slate-600 uppercase text-xs sm:text-sm tracking-widest font-semibold">
                                    <th class="py-4 px-3 sm:py-5 sm:px-4 text-center">Rank</th>
                                    <th class="py-4 px-3 sm:py-5 sm:px-4">Name</th>
                                    <th class="py-4 px-4 sm:py-5 sm:px-6">Wing</th>
                                    <th class="py-4 px-3 sm:py-5 sm:px-4 text-center">Class 1</th>
                                    <th class="py-4 px-3 sm:py-5 sm:px-4 text-center">Class 2</th>
                                    <th class="py-4 px-3 sm:py-5 sm:px-4 text-center">Class 3</th>
                                    <th class="py-4 px-3 sm:py-5 sm:px-4 text-center">Class 4</th>
                                    <th class="py-4 px-3 sm:py-5 sm:px-4 text-center">Class 5</th>
                                    <th class="py-4 px-4 sm:py-5 sm:px-6 text-center text-amber-800 font-bold">Total</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody" class="divide-y divide-amber-900/5 text-sm sm:text-base">
                                <tr>
                                    <td colspan="8" class="p-16 text-center">
                                        <div class="flex flex-col items-center justify-center gap-4">
                                            <div class="w-10 h-10 border-3 border-amber-600 border-t-transparent rounded-full animate-spin shadow-md"></div>
                                            <span class="font-medium text-slate-500 text-sm tracking-wide">Loading elite results...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <div class="text-center mt-14 mb-4">
                <h3 class="text-3xl sm:text-4xl font-bold text-amber-800 font-winners tracking-wide italic drop-shadow-sm">
                    بارك الله فيكم
                </h3>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="py-8 text-center text-slate-500 text-xs flex flex-col sm:flex-row items-center justify-center gap-4 border-t border-amber-500/10 bg-white/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <img src="https://raw.githubusercontent.com/fayizsalam/QHLS_Quiz_Results/refs/heads/main/Wisdom%20youth.png" 
                 onerror="this.style.display='none'" 
                 alt="wisdom youth Logo Footer" 
                 class="h-12 w-auto opacity-80 hover:opacity-100 transition-opacity">
        </div>
        <span class="tracking-widest uppercase text-[10px]">© 2026 QHLS • All Rights Reserved</span>
    </footer>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5; 
                this.speedY = Math.random() * 0.2 + 0.05;
                this.speedX = (Math.random() - 0.5) * 0.1;
                this.opacity = Math.random() * 0.35 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(217, 180, 74, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX727T4ALUYfY-rKR4LdqvKWGZ-TuOiO_98FyaGjf_DirjYIi2awK4ymr_vRJ81U0HusrmG3E4kw73/pub?gid=1247926042&single=true&output=csv";
        const resultsTableBody = document.querySelector("#resultsTableBody");
        const resultsCardContainer = document.querySelector("#resultsCardContainer");

        fetch(csvURL)
            .then(res => res.text())
            .then(data => {
                const rows = data.trim().split("\n");
                let results = rows.slice(1).map(row => {
                    const cols = row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim());
                    return {
                        name: cols[0],
                        wing: cols[1],
                        class1: cols[3],
                        class2: cols[4],
                        class3: cols[5],
                        class4: cols[6],
                        class5: cols[7],
                        total: parseFloat(cols[8]) || 0
                    };
                });

                results.sort((a, b) => b.total - a.total);
                 results = results.slice(0, 10);
                
                let tableHTML = "";
                let cardHTML = "";

                results.forEach((item, index) => {
                    const rank = index + 1;
                    let rankBadge = `<span class="font-bold text-slate-700">${rank}</span>`;
                    
                    if (rank === 1) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-400 text-slate-900 font-bold shadow-sm">1</span>`;
                    else if (rank === 2) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-300 text-slate-800 font-bold shadow-sm">2</span>`;
                    else if (rank === 3) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-300 text-slate-800 font-bold shadow-sm">3</span>`;
                    else if (rank === 4) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-700 text-white font-bold shadow-sm">4</span>`;
                    else if (rank === 5) rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-amber-700 text-white font-bold shadow-sm">5</span>`;

                    tableHTML += `
                        <tr class="glass-row">
                            <td class="py-4 px-3 sm:py-4 sm:px-4 text-center">${rankBadge}</td>
                            <td class="py-4 px-3 sm:py-4 sm:px-4 font-semibold text-slate-900">${item.name}</td>
                            <td class="py-4 px-4 sm:py-4 sm:px-6 text-slate-600">${item.wing}</td>
                            <td class="py-4 px-3 sm:py-4 sm:px-4 text-center text-slate-700">${item.class1}</td>
                            <td class="py-4 px-3 sm:py-4 sm:px-4 text-center text-slate-700">${item.class2}</td>
                            <td class="py-4 px-3 sm:py-4 sm:px-4 text-center text-slate-700">${item.class3}</td>
                            <td class="py-4 px-3 sm:py-4 sm:px-4 text-center text-slate-700">${item.class4}</td>
                            <td class="py-4 px-3 sm:py-4 sm:px-4 text-center text-slate-700">${item.class5}</td>
                            <td class="py-4 px-4 sm:py-4 sm:px-6 text-center font-bold text-amber-800 text-lg">${item.total}</td>
                        </tr>
                    `;

                    cardHTML += `
                        <div class="glass-panel rounded-[24px] p-5 shadow-md border border-amber-500/20 relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3 border-b border-amber-500/10 pb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center font-bold text-amber-800 text-lg shadow-sm">
                                        ${rankBadge}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-base leading-tight">${item.name}</h4>
                                        <span class="text-xs text-amber-800/80 font-medium tracking-wide uppercase">${item.wing}</span>
                                    </div>
                                </div>
                                <div class="text-right bg-amber-500/10 px-3 py-1.5 rounded-xl border border-amber-500/20">
                                    <span class="text-[10px] uppercase text-slate-500 block leading-none">Total</span>
                                    <span class="font-bold text-amber-800 text-xl">${item.total}</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-4 gap-2 text-center pt-1 text-xs">
                                <div class="bg-white/60 p-2 rounded-xl border border-amber-500/10">
                                    <span class="text-slate-400 block text-[10px]">C 1</span>
                                    <span class="font-semibold text-slate-700 text-sm">${item.class1}</span>
                                </div>
                                <div class="bg-white/60 p-2 rounded-xl border border-amber-500/10">
                                    <span class="text-slate-400 block text-[10px]">C 2</span>
                                    <span class="font-semibold text-slate-700 text-sm">${item.class2}</span>
                                </div>
                                <div class="bg-white/60 p-2 rounded-xl border border-amber-500/10">
                                    <span class="text-slate-400 block text-[10px]">C 3</span>
                                    <span class="font-semibold text-slate-700 text-sm">${item.class3}</span>
                                </div>
                                <div class="bg-white/60 p-2 rounded-xl border border-amber-500/10">
                                    <span class="text-slate-400 block text-[10px]">C 4</span>
                                    <span class="font-semibold text-slate-700 text-sm">${item.class4}</span>
                                </div>
                                <div class="bg-white/60 p-2 rounded-xl border border-amber-500/10">
                                    <span class="text-slate-400 block text-[10px]">C 5</span>
                                    <span class="font-semibold text-slate-700 text-sm">${item.class5}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                resultsTableBody.innerHTML = tableHTML;
                resultsCardContainer.innerHTML = cardHTML;
            })
            .catch(err => {
                console.error("Error loading CSV:", err);
                resultsTableBody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-500 font-medium">Failed to load quiz results. Please try again later.</td></tr>`;
                resultsCardContainer.innerHTML = `<div class="glass-panel p-6 text-center text-red-500 rounded-[24px]">Failed to load results.</div>`;
            });
    </script>
</body>
</html>
